name: Deploy Bot

on:
  push:
    branches:
      - main

concurrency:
  group: tu-tio-bot-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to Oracle VM
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          DEPLOY_SHA: ${{ github.sha }}
        with:
          envs: DEPLOY_SHA
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          port: ${{ secrets.ORACLE_PORT }}
          fingerprint: ${{ secrets.ORACLE_HOST_FINGERPRINT }}
          script: |
            set -euo pipefail

            cd /opt/tu-tio-bot/app

            git fetch origin main
            git show "$DEPLOY_SHA:scripts/check-checkout-databases.sh" | bash -s -- "$DEPLOY_SHA"
            git reset --hard "$DEPLOY_SHA"

            node scripts/check-runtime.mjs
            npm ci --include=dev
            npm run check:audio
            npx prisma migrate deploy
            npm run build
            npm run deploy

            sudo /usr/bin/systemctl restart tu-tio-bot
            sudo /usr/bin/systemctl status tu-tio-bot --no-pager
